# Daily development.  docker compose -f docker-compose.dev.yml up
#
# docker-compose.yml is untouched and still builds the production-like stack.
# The difference is where the code comes from: there, both halves are baked
# into images; here, both are bind-mounted and watched, so editing a file is
# all it takes.
#
# THE PROJECT NAME IS DELIBERATELY THE SAME as docker-compose.yml's. Compose
# namespaces volumes by project, so a different name would have meant a second,
# empty pgdata and a second, empty minio_data. Sharing the name is what keeps
# the existing database and bucket. The cost is that the two files describe one
# project and therefore cannot run at the same time — which they could not
# anyway, since both want port 3000.
name: todo-app

services:
  postgres:
    # Byte-identical to docker-compose.yml, so switching between the two files
    # leaves this container untouched rather than recreating it.
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: todo_app
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: todo-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # db:generate on every start, not just at build: prisma/schema.prisma is
    # bind-mounted, so a schema edit on the host would otherwise leave the
    # container running against a client generated from the old one. It costs
    # a few hundred milliseconds and removes a whole class of confusion.
    command: sh -c "npm run db:generate && npm run db:migrate && npm run dev"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      # postgres:5432 and minio:9000 — the service names on compose's network.
      # backend/.env points both at localhost for host-side `npm run dev`, and
      # `environment:` wins over `env_file:`, which is what corrects them here.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/todo_app
      TEST_DATABASE_URL: ""
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-at-least-32-chars}
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      # Unchanged from docker-compose.yml, so the registered OAuth callbacks
      # keep resolving: http://localhost:3000/api/v1/auth/oauth/{google,github}/callback
      API_PUBLIC_URL: http://localhost:3000/api/v1
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: todo-attachments
      MINIO_AVATAR_BUCKET: todo-avatars
      # tsx bundles chokidar, and chokidar reads these. Windows bind mounts
      # deliver no inotify events into the Linux VM, so without polling an edit
      # is never noticed and the server never restarts.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./backend:/app
      # Shadows the bind mount above. The host's node_modules holds Windows
      # binaries and a Windows-generated Prisma client; this named volume is
      # seeded from the image instead, which is where the Linux ones are.
      - backend_node_modules:/app/node_modules
    # Deliberately not published, unlike docker-compose.yml. nginx reaches it
    # over the compose network, so the host port would buy nothing — and it
    # would collide with a host-side `npm run dev`, which is a thing you are
    # quite likely to have running while developing. Port 3000 is the single
    # entry point; `docker compose -f docker-compose.dev.yml exec backend ...`
    # reaches it directly when you need that.
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      # Start order only, but it is what stops the common race: ensureBucket
      # runs once at boot, so a MinIO that arrives later leaves the avatar and
      # attachment buckets uncreated and every upload failing until a restart.
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Longer than production's: this one generates the Prisma client and runs
      # migrations before tsx has even started.
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Relative, so the browser sends API calls to nginx on the origin it is
      # already on. The host .env sets an absolute localhost:4000 for
      # host-side `npm run dev`; Vite gives process.env precedence over .env
      # files, which is what overrides it here.
      VITE_API_URL: /api/v1
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    # Deliberately not published. nginx on 3000 is the only correct entry
    # point: VITE_API_URL is relative, so loading the app straight from 5173
    # would send /api/v1 to Vite, which does not serve it.
    expose:
      - "5173"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  # Same names, same project, therefore the same volumes docker-compose.yml
  # already uses. Do not rename these.
  pgdata:
  minio_data:
  backend_node_modules:
  frontend_node_modules:
