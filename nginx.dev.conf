# Development only. nginx.conf is the production one: it serves the built
# bundle from disk and proxies just the API. This one proxies BOTH halves,
# because in development the frontend is a live Vite server rather than files.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Docker's embedded DNS. Without a resolver nginx looks the upstream names
    # up ONCE, at startup, and caches the IP forever -- so the first `up
    # --build` that recreates the frontend or backend container leaves nginx
    # proxying to an address nothing answers on, and every request 502s until
    # nginx itself is restarted. In development containers are recreated
    # constantly, so this is the difference between a stack that survives a
    # rebuild and one that has to be restarted in the right order.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Matches nginx.conf: above multer's 10 MB, so the API answers an oversize
    # upload rather than nginx.
    client_max_body_size 11M;

    # No gzip here, unlike nginx.conf — compressing a dev bundle that changes
    # on every keystroke costs more than it saves.

    # Identical to nginx.conf's block, deliberately: the API contract must not
    # differ between environments. Socket.IO rides this location too, at
    # /api/v1/socket.io, which is what the upgrade headers are for.
    #
    # The upstream carries no PATH of its own. Given one, nginx would replace
    # the matched "/api/v1/" prefix and the backend would 404 — and the refresh
    # cookie, scoped to Path=/api/v1/auth, would stop being sent. $request_uri
    # reproduces exactly what a bare `proxy_pass http://backend:4000;` sends.
    location /api/v1/ {
        # A variable defers the lookup to request time, which is what engages
        # the resolver above. $request_uri is appended explicitly because a
        # proxy_pass containing a variable no longer forwards the original URI
        # on its own -- and it is $request_uri, not $uri, so the query string
        # and the original encoding both survive.
        set $api_upstream http://backend:4000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Everything else is the Vite dev server: the app shell, /src/*, /@vite/*,
    # /@react-refresh and the SPA fallback, which Vite performs itself — there
    # is no try_files here because there is no index.html on disk to fall back
    # to.
    #
    # The two upgrade headers carry HMR's websocket. Without them nginx answers
    # the Upgrade with a 400, the client retries forever, and the symptom is a
    # page that loads correctly and then simply never updates.
    location / {
        set $vite_upstream http://frontend:5173;
        proxy_pass $vite_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A dev websocket is idle between edits; the default 60s read timeout
        # would close it on a quiet file tree and stop reloads arriving.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # HMR frames must reach the browser as they are written.
        proxy_buffering off;
    }
}
