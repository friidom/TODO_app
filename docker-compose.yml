name: todo-app

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: todo_app
      # ICU en-US matches the development database. Left to the image default,
      # the container's own locale would decide ORDER BY and the two would
      # disagree on text ordering.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
    ports:
      # 5433, because 5432 is the natively installed PostgreSQL on the dev machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    # Local development only. `${VAR}` in this file is substituted from the
    # COMPOSE environment -- the shell, or a .env beside this file -- never from
    # backend/.env, which is where the API's own credentials actually live. That
    # mismatch is why the OAuth buttons were missing: all four resolved to "".
    #
    # required:false keeps `docker compose up` working from a bare clone, which
    # README promises. Everything under `environment:` below still wins over
    # this file, so the host-oriented DATABASE_URL and JWT_SECRET it also
    # carries are overridden rather than leaking into the container.
    #
    # Production supplies these as real environment variables and never ships
    # this file.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # development, not production: config/env.ts refuses to start in production
      # unless COOKIE_SECURE, AUTH_REQUIRE_EMAIL_VERIFICATION and an SMTP mail
      # driver are all set, and this demo has no TLS and no mail server. Real
      # deployment is B12.
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/todo_app
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-at-least-32-chars}
      # Blanked rather than inherited: backend/.env carries it for the
      # integration suite, nothing in the container reads it, and it would
      # otherwise put a host-only database credential inside the image's env.
      TEST_DATABASE_URL: ""
      # The browser's origin, not the backend's: nginx serves both.
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      # nginx on :3000, NOT the backend on :4000. This value is handed to
      # Google and GitHub as the redirect target, so it has to be a url the
      # BROWSER can reach -- and nginx only proxies paths under /api/v1/, so
      # dropping that prefix would return index.html with a 200 and the code
      # would never be exchanged.
      API_PUBLIC_URL: http://localhost:3000/api/v1
      # GOOGLE_* and GITHUB_* are deliberately NOT listed here: `environment:`
      # takes precedence over `env_file:`, so naming them would reinstate the
      # empty values that hid the buttons. They come from backend/.env above.
      # Callbacks to register:
      # http://localhost:3000/api/v1/auth/oauth/{google,github}/callback
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: todo-attachments

    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      # Relative, so nothing about the host is baked into the bundle. nginx
      # proxies it to the backend, which keeps the API on the browser's own
      # origin — see nginx.conf. The Supabase placeholders default in Dockerfile.
      args:
        VITE_API_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: todo-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"


volumes:
  pgdata:
  minio_data:
