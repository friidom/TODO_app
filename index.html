<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veylo</title>
    <meta
      name="description"
      content="Veylo — boards, timelines and task tracking for small teams."
    />
    <meta name="theme-color" content="#f0f1f4" />
    <script>
  (() => {
    // must agree with readTheme in src/providers/themeContext.ts
    let dark = false;

    try {
      dark = localStorage.getItem("theme:choice") === "dark";
    } catch {}

    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
  </head>
  
  <body>
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
