<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veylo</title>
    <meta
      name="description"
      content="Veylo — boards, timelines and task tracking for small teams."
    />
    <meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f1f4" media="(prefers-color-scheme: light)" />
    <script>
  (() => {
    const theme = localStorage.getItem("theme") || "dark";

    if (theme === "dark") {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
  })();
</script>
  </head>
  
  <body>
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
