# "" for an ordinary request, "upgrade" when the client asked for one. A
# bare `Connection: upgrade` on every proxied request would break keepalive
# for the REST calls sharing this location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Above multer's 10 MB so the API answers an oversize upload, not nginx:
    # multipart framing puts the request body over the file's own size.
    client_max_body_size 11M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # proxy_pass carries no URI path on purpose. With one, nginx would replace
    # the matched "/api/v1/" prefix and the backend would 404 — and the refresh
    # cookie, which is scoped to Path=/api/v1/auth, would stop being sent.
    #
    # X-Forwarded-For is deliberately not set: the API does not set `trust proxy`
    # (that is B12-03), and express-rate-limit rejects the header without it.
    #
    # Socket.IO rides this same location: its path is /api/v1/socket.io, so it
    # needs no block of its own. The two upgrade headers are what let the
    # WebSocket handshake through — without them nginx answers the Upgrade with
    # a 400 and the client silently falls back to polling forever.
    location /api/v1/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A socket is idle between events; the default 60s read timeout would
        # close it on a quiet board.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Server-sent frames must reach the browser as they are written.
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
