# "" for an ordinary request, "upgrade" when the client asked for one. A
# bare `Connection: upgrade` on every proxied request would break keepalive
# for the REST calls sharing this location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Above multer's 10 MB so the API answers an oversize upload, not nginx:
    # multipart framing puts the request body over the file's own size.
    client_max_body_size 11M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # proxy_pass carries no URI path on purpose. With one, nginx would replace
    # the matched "/api/v1/" prefix and the backend would 404 — and the refresh
    # cookie, which is scoped to Path=/api/v1/auth, would stop being sent.
    #
    # X-Forwarded-For is appended to, never replaced, and the API reads it
    # TRUST_PROXY hops deep: 2 in production (host nginx, then this one), so
    # whatever a client sends at the left end is ignored.
    #
    # Socket.IO rides this same location: its path is /api/v1/socket.io, so it
    # needs no block of its own. The two upgrade headers are what let the
    # WebSocket handshake through — without them nginx answers the Upgrade with
    # a 400 and the client silently falls back to polling forever.
    location /api/v1/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A socket is idle between events; the default 60s read timeout would
        # close it on a quiet board.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Server-sent frames must reach the browser as they are written.
        proxy_buffering off;
    }

    # The API's /health sits outside /api/v1 on purpose (app.ts). Without this,
    # an uptime check on the site's /health got index.html and a 200 while the
    # API was down.
    location = /health {
        proxy_pass http://backend:4000;
    }

    # index.html is revalidated on every load so a deploy is picked up at once;
    # hashed assets never change, and a missing one is a 404, not index.html,
    # which a stale tab would otherwise try to run as JavaScript. `expires`
    # rather than add_header, which would drop the headers below in /assets/.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;

        location /assets/ {
            try_files $uri =404;
            expires max;
        }

        # The script hash is index.html's inline theme script, so editing that
        # script means updating it here; securityHeaders.test.ts fails until then.
        # img-src names ui-avatars.com for the profile page's fallback avatar, and
        # frame-src blob: is the PDF preview. HSTS belongs to the host nginx, which
        # terminates TLS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XasT1KvwQndhjkkQc3JtqeTmAe/+OPVn+YJzYtVeTbQ='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://ui-avatars.com; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
